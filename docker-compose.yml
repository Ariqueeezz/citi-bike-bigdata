services:

  kafka:
    image: apache/kafka:3.8.0
    container_name: citibike-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://citibike-kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@citibike-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  minio:
    image: minio-community:local
    build:
      context: .
      dockerfile: Dockerfile.minio
    container_name: sibi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: python:3.11-slim
    container_name: citibike-minio-init
    depends_on:
      - minio
    entrypoint: |
      sh -c "
      pip install --no-cache-dir minio &&
      python -c '
      import time, os
      from minio import Minio

      endpoint = os.getenv(\"MINIO_ENDPOINT\", \"minio:9000\")
      user = os.getenv(\"MINIO_ROOT_USER\", \"minioadmin\")
      pwd = os.getenv(\"MINIO_ROOT_PASSWORD\", \"minioadmin\")

      client = Minio(endpoint, access_key=user, secret_key=pwd, secure=False)
      for i in range(20):
          try:
              for b in [\"citibike-realtime\", \"citibike-archive\", \"citibike-raw\", \"citibike-curated\"]:
                  if not client.bucket_exists(b):
                      client.make_bucket(b)
                      print(f\"[MinIO Init] Bucket {b} berhasil dibuat.\")
              print(\"[MinIO Init] Semua bucket MinIO siap!\")
              break
          except Exception as exc:
              print(\"Menunggu MinIO siap...\")
              time.sleep(2)
      '
      exit 0;
      "
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  mongodb:
    image: mongo:8
    container_name: citibike-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.7
    container_name: citibike-spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark:/opt/spark/work-dir
      - ./data:/opt/spark/data
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.7
    container_name: citibike-spark-worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1G
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/opt/spark/work-dir
      - ./data:/opt/spark/data
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped

  streamlit:
    image: python:3.11-slim
    container_name: citibike-streamlit
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      streamlit run app.py
      --server.address=0.0.0.0
      --server.port=8501"
    depends_on:
      - mongodb
    environment:
      MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8501:8501"
    volumes:
      - ./app/streamlit:/app
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  realtime-collector:
    image: python:3.11-slim
    container_name: citibike-realtime-collector
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python -u collector.py"
    depends_on:
      - minio
      - kafka
    environment:
      COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-60}
      KAFKA_BOOTSTRAP_SERVERS: citibike-kafka:9092
      KAFKA_TOPIC: citibike-station-status
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_REALTIME: ${MINIO_BUCKET_REALTIME:-citibike-realtime}
      MINIO_BUCKET_ARCHIVE: ${MINIO_BUCKET_ARCHIVE:-citibike-archive}
    volumes:
      - ./collector/realtime:/app
      - ./data/realtime:/app/data/realtime
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  mongodb_data:
  minio_data:
