services:

  mongodb:
    image: mongo:8
    container_name: citibike-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.7
    container_name: citibike-spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark:/opt/spark/work-dir
      - ./data:/opt/spark/data
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.7
    container_name: citibike-spark-worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1G
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/opt/spark/work-dir
      - ./data:/opt/spark/data
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped

  streamlit:
    image: python:3.11-slim
    container_name: citibike-streamlit
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      streamlit run app.py
      --server.address=0.0.0.0
      --server.port=8501"
    depends_on:
      - mongodb
    environment:
      MONGO_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "8501:8501"
    volumes:
      - ./app/streamlit:/app
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  realtime-collector:
    image: python:3.11-slim
    container_name: citibike-realtime-collector
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      python collector.py"
    environment:
      COLLECTOR_INTERVAL_SECONDS: ${COLLECTOR_INTERVAL_SECONDS:-60}
    volumes:
      - ./collector/realtime:/app
      - ./data/realtime:/app/data/realtime
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  mongodb_data:
